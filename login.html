<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول المسؤول</title><style>body{font-family:system-ui;background:#0b1220;color:#e8eef6;padding:30px}.box{max-width:440px;margin:10vh auto;background:#121d2d;border:1px solid #26364a;padding:24px;border-radius:14px}input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px}input{background:#0b1524;color:white;border:1px solid #26364a}button{background:#176c5a;color:white;border:0}a{color:#7eb6ff}.err{color:#f17c7c}</style><div class="box"><h2>إعدادات مسؤول الرادار</h2>{% if disabled %}<p class="err">الإعدادات مقفلة. أضف RADAR_ADMIN_PASSWORD إلى متغيرات البيئة في Render.</p>{% else %}<form method="post"><label>كلمة مرور المسؤول</label><input type="password" name="password" required autocomplete="current-password"><button>دخول</button></form>{% for m in get_flashed_messages() %}<p class="err">{{m}}</p>{% endfor %}{% endif %}<p><a href="/">العودة للرادار</a></p></div>
